*{box-sizing:border-box}

.tile{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:.5rem .3rem;text-align:center;cursor:pointer}
.tile b{display:block;font-size:1.7rem;font-family:"Baloo Bhai 2",sans-serif}

.opt.bad{background:var(--badbg);border-color:var(--bad)}

.bar i{display:block;height:100%;background:var(--acc)}
.score{font-family:"Baloo Bhai 2",sans-serif;font-size:3rem;font-weight:800}
.mute{color:var(--mute)}
.exp{background:var(--okbg);border-radius:10px;padding:.5rem .7rem;margin-top:.5rem}
ul{padding-left:1.2rem;margin:.3rem 0}

.sq.sel{box-shadow:inset 0 0 0 4px var(--acc)}.sq.tg{background-image:radial-gradient(circle,rgba(244,163,0,.85) 18%,transparent 20%)}
.bub{padding:.5rem .8rem;border-radius:14px;margin:.4rem 0;white-space:pre-wrap;max-width:94%;overflow-wrap:anywhere}
.bub.u{background:var(--acc);color:var(--accink);margin-left:auto;width:fit-content}.bub.a{background:var(--bg);border:2px solid var(--line)}
input{font:inherit;color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:.5rem .7rem;flex:1;min-width:0}
.chip{display:inline-block;margin:.2rem .3rem .2rem 0;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.15rem .7rem;cursor:pointer;font-size:.9rem}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#mvs{border-radius:16px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;color:#fff;text-align:center;margin:.6rem 0}

@media (prefers-reduced-motion:reduce){#mve{animation:none!important}}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>

async function mvMake(){var t=$('#mt').value.trim();if(!t||cb)return;MVS=t;var st=$('#mst');st.textContent='મૂવી બનાવી રહ્યો છું…';var S=await claude.use('sample');if(!S){st.textContent='AI અહીં ઉપલબ્ધ નથી.';return}cb=true;try{var r=await S('Convert this script into 4 to 8 short scenes for an animated slide-movie for students. Return ONLY a JSON array, no markdown: [{"narration":"1-2 short sentences in Gujarati","emoji":"2-4 emoji that illustrate the scene","bg":"a dark hex colour like #1d3557"}]. Script: '+t,{cache:false});var x=r.text||'',a=x.indexOf('['),b=x.lastIndexOf(']');var m=JSON.parse(x.slice(a,b+1));if(!m.length)throw 0;MV=m;mvShow(0);st.textContent='તૈયાર! ▶ પ્લે દબાવો.'}catch(e){st.textContent=e&&e.code==='not_granted'?'AI વાપરવા માટે મંજૂરી આપો.':'મૂવી બન્યું નહીં. સ્ક્રિપ્ટ થોડી ટૂંકી કરીને ફરી પ્રયત્ન કરો.'}cb=false}

async function bkLoad(inp){var f=inp.files[0],i=$('#bi');if(!f)return;if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){i.textContent='કૃપા કરીને PDF પુસ્તક પસંદ કરો.';return}if(!window.pdfjsLib){i.textContent='PDF વાંચવાની સુવિધા લોડ થઈ નથી. ઇન્ટરનેટ તપાસો.';return}i.textContent='PDF વાંચી રહ્યો છું…';try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';var d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,t='',n=Math.min(d.numPages,80);for(var p=1;p<=n&&t.length<60000;p++){var pg=await d.getPage(p),c=await pg.getTextContent();t+='\n[પાનું '+p+'] '+c.items.map(function(x){return x.str}).join(' ')}BK.t=t;BK.n=f.name;i.textContent='📄 '+f.name+' — '+d.numPages+' પાનાં'+(t.replace(/\s/g,'').length<300?'. લખાણ વાંચી શકાયું નહીં (સ્કેન કરેલી કે ખાસ ફૉન્ટવાળી PDF હોઈ શકે). "સ્વાધ્યાય સોલ્યુશન" ટૅબમાં પાનાનો ફોટો વાપરો.':'. તૈયાર!')}catch(e){i.textContent='PDF વાંચી શકાઈ નહીં.'}}
async function bkAsk(){var q=$('#bq').value.trim(),c=$('#bc').value.trim(),o=$('#bo');if(cb)return;if(!BK.t){alert('પહેલા પાઠ્યપુસ્તકની PDF અપલોડ કરો.');return}if(!q){alert('તમારો પ્રશ્ન લખો.');return}o.style.display='block';o.textContent='જવાબ તૈયાર થઈ રહ્યો છે…';var S=await claude.use('sample');if(!S){o.textContent='AI અહીં ઉપલબ્ધ નથી.';return}cb=true;try{await S('You are a patient Gujarat school teacher. Class '+grade+', subject '+$('#bs').value+(c?', chapter '+c:'')+'. Answer the student question using ONLY the textbook text below. If the answer is not in the text, say so instead of guessing. Reply in simple Gujarati, step by step.\n\nStudent question: '+q+'\n\nTextbook text from the PDF the student uploaded:\n'+BK.t.slice(0,45000),{cache:false,onText:function(x){o.textContent=x.text}})}catch(e){o.textContent=e&&e.code==='not_granted'?'AI વાપરવા માટે મંજૂરી આપો.':'હમણાં જવાબ મળ્યો નહીં. થોડીવારમાં ફરી પ્રયત્ન કરો.'}cb=false}
